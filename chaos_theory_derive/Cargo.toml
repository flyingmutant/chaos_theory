[package]
name = "chaos_theory_derive"
description = "Derive macro for chaos_theory::Arbitrary"
rust-version = "1.88"

version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
prettyplease.workspace = true
syn = { workspace = true, default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "full", "clone-impls"] }
