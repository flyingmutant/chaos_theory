# Format: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
  "/chaos_theory/UCD/",
  "/chaos_theory/gen/",
  "/chaos_theory/src/tests_crates_regex.rs",
]

[default.extend-words]
"Nd" = "Nd"  # Unicode category name

[default.extend-identifiers]
typ = "typ"

[default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line",                        # spellchecker:disable-line
  "(#|//)\\s*spellchecker:ignore-next-line\\n.*",                       # spellchecker:ignore-next-line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",  # spellchecker:<on|off>
]
