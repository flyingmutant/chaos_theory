[package]
name = "chaos_theory"
description = "Modern property-based testing and structure-aware fuzzing library"
rust-version = "1.88"

version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
readme = "../README.md"
exclude = ["/UCD/"]

[package.metadata.docs.rs]
features = ["all"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["std"]
all = ["std", "derive", "ecow", "hashbrown", "indexmap", "ordered_float", "regex", "tinyvec"]
std = []
no_std = ["dep:libm"]
derive = ["dep:chaos_theory_derive"]
ecow = ["dep:ecow"]
hashbrown = ["dep:hashbrown"]
indexmap = ["dep:indexmap"]
ordered_float = ["dep:ordered-float"]
regex = ["std", "dep:regex", "dep:regex-syntax"]
tinyvec = ["dep:tinyvec"]

nightly = ["_bench"]
_bench = []

[dependencies]
chaos_theory_derive = { workspace = true, optional = true }
ecow = { workspace = true, optional = true }
hashbrown = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
ordered-float = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
regex-syntax = { workspace = true, optional = true }
tinyvec = { workspace = true, optional = true, features = ["alloc"] }
libm = { workspace = true, optional = true }

[dev-dependencies]
regex.workspace = true
libfuzzer-sys.workspace = true
