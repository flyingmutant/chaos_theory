[package]
name = "chaos_theory"
description = "Modern property-based testing and structure-aware fuzzing library"
rust-version = "1.88"

version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
readme = "../README.md"
exclude = ["/UCD/"]

[package.metadata.docs.rs]
features = ["all"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["std"]
all = ["std", "derive", "bstr", "bytes", "ecow", "either", "hashbrown", "indexmap", "jiff", "ordermap", "ordered_float", "regex", "serde_json", "serde_json_preserve_order", "tinyvec", "uuid"]
std = ["indexmap?/std", "jiff?/std", "ordermap?/std", "regex?/std"]
no_std = ["dep:libm"]
derive = ["dep:chaos_theory_derive"]
bstr = ["dep:bstr"]
bytes = ["dep:bytes"]
ecow = ["dep:ecow"]
either = ["dep:either"]
hashbrown = ["dep:hashbrown"]
indexmap = ["dep:indexmap"]
jiff = ["dep:jiff"]
ordermap = ["dep:ordermap"]
ordered_float = ["dep:ordered-float"]
regex = ["dep:regex", "dep:regex-syntax"]
serde_json = ["dep:serde_json", "serde_json/alloc"]
serde_json_preserve_order = ["std", "serde_json", "serde_json/preserve_order"]
tinyvec = ["dep:tinyvec"]
uuid = ["dep:uuid"]

nightly = ["_bench"]
_bench = []

[dependencies]
chaos_theory_derive = { workspace = true, optional = true }
bstr = { workspace = true, optional = true, features = ["alloc"] }
bytes = { workspace = true, optional = true }
ecow = { workspace = true, optional = true }
either = { workspace = true, optional = true }
hashbrown = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
ordermap = { workspace = true, optional = true }
ordered-float = { workspace = true, optional = true }
regex = { workspace = true, optional = true, features = ["perf", "unicode"] }
regex-syntax = { workspace = true, optional = true, features = ["unicode"] }
serde_json = { workspace = true, optional = true }
tinyvec = { workspace = true, optional = true, features = ["alloc"] }
uuid = { workspace = true, optional = true }
libm = { workspace = true, optional = true }

[dev-dependencies]
regex = { workspace = true, features = ["std", "perf", "unicode"] }
libfuzzer-sys.workspace = true
